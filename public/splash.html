<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>启动中</title>
<style>
  /* 整页完全透明：窗口本身 transparent:true，这里再给 html/body 透明底。
     少这一条就会有一层背景板挡住桌面 —— 那个"黑框"就是这么来的。 */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    user-select: none;
    cursor: default;
    -webkit-app-region: drag;
  }

  .stage {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* 启动窗按 128 物理像素设计，本机 150% 缩放 = 85 DIP。
     图必须填满整窗，否则在这么小的格子里会再缩一圈、只剩几个像素。
     阴影收小：窗外区域的 drop-shadow 会被窗口裁掉，留大值只是白算。 */
  .buddy {
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center bottom;
    pointer-events: none;
    filter: drop-shadow(0 1px 3px rgba(0, 0, 0, .35));
  }
</style>
</head>
<body>
  <div class="stage">
    <img class="buddy" id="buddy" src="/splash.gif" alt="">
  </div>

  <script>
    /* 播完一遍就通知主进程开主窗口。
       时长不手写常量 —— 之前按字节数猜错过一次（把 2080ms 猜成 800ms），
       现在读 splash.json 里由 PIL 逐帧量出来的真值（43 帧 / 2080ms）。 */
    /* 只播一次。
       splash.gif 里的 NETSCAPE2.0 循环扩展已被去掉，浏览器对没有 loop 的 GIF
       按「播完停在最后一帧」处理 —— 这是原生行为，不靠页面代工。
       启动窗要等主窗画好才关，主窗慢一点也只会看到静止的末帧，不会重播。 */
    const TAIL_MS = 120;
    const FALLBACK_MS = 8000;
    const img = document.getElementById('buddy');

    let fired = false;
    function done() {
      if (fired) return;
      fired = true;
      if (window.mcSplash && typeof window.mcSplash.done === 'function') {
        window.mcSplash.done();
      }
    }

    async function start() {
      let ms = 2100; // 读取失败时的兜底，接近实测 2080
      try {
        const r = await fetch('/splash.json', { cache: 'no-store' });
        if (r.ok) {
          const j = await r.json();
          if (Number.isFinite(j.durationMs) && j.durationMs > 0) ms = j.durationMs;
        }
      } catch {
        /* 读不到就用兜底值，不能因为元数据缺失卡住启动 */
      }
      setTimeout(done, ms + TAIL_MS);
    }

    // 图片解码完成后再开始计时，避免把加载时间算进播放时长
    if (img.complete && img.naturalWidth > 0) start();
    else img.addEventListener('load', start, { once: true });

    // 图挂了也必须能进主界面，否则透明窗没有边框按钮，等于程序消失
    img.addEventListener('error', done, { once: true });
    setTimeout(done, FALLBACK_MS);
  </script>
</body>
</html>
